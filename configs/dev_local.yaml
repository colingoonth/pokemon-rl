# Local dev config: small budget, few envs, runs in minutes on laptop.
run_name: dev_local
total_timesteps: 8192
n_envs: 4
n_steps: 128
n_epochs: 4
minibatch_size: 64
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 1
