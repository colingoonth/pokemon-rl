# ELSA L40S config aimed at Brock badge.
# Estimated wall-clock: ~24-36 hours per full run (200M timesteps,
# 32 envs, no I/O hotspots).
run_name: elsa_brock
total_timesteps: 200_000_000
n_envs: 32
n_steps: 256        # 32 * 256 = 8192 timesteps per rollout
n_epochs: 4
minibatch_size: 512  # 8192 / 16 minibatches per epoch
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
