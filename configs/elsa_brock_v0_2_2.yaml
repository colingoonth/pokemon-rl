# V0.2.2: same PPO + V0.2.1 weights, but fixes the flee-as-win bug
# and adds new-map (+5), catch (+5), and new-species catch (+20).
run_name: elsa_brock_v0_2_2
total_timesteps: 200_000_000
n_envs: 32
n_steps: 256
n_epochs: 4
minibatch_size: 512
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_2_2
