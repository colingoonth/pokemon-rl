# V0.2.3 with 62 envs (vs the 32-env baseline in elsa_brock_v0_2_3.yaml).
# Same reward, same hyperparams — only n_envs differs. Used as an A/B
# scaling experiment to measure samples-per-second vs the 32-env run.
# Rollout batch = 62 * 256 = 15872, evenly divisible by minibatch_size 512.
run_name: elsa_brock_v0_2_3_n62
total_timesteps: 200_000_000
n_envs: 62
n_steps: 256
n_epochs: 4
minibatch_size: 512
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_2_3
