# V0.3.0: curriculum fork. Start state = right before Blue rival battle
# with Squirtle. Removes the bootstrap problem (agent can't avoid combat).
# Reward function inherited from V0.2.7 (BEAT_MON 20, TRAINER_WIN 30,
# FAINT -25, MART_PC +10, GYM +20, entropy_coef 0.03).
run_name: elsa_brock_v0_3_0_ddp4
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 32
n_steps: 256
n_epochs: 4
minibatch_size: 512
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.03
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_2_7
