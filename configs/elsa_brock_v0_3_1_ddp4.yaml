# V0.3.1: V0.3.0 curriculum + FLEE_PENALTY -1 -> -5.
# V0.3.0 showed the agent correctly EV-fleeing fights below the 60%
# breakeven. Bumping FLEE_PENALTY drops the breakeven to ~45%, pushing
# the agent to engage borderline matchups. Doesn't bias in-battle
# action selection — only the leave-battle action is penalized, so
# status-move exploration (Tail Whip stacking, etc.) is preserved.
run_name: elsa_brock_v0_3_1_ddp4
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 32
n_steps: 256
n_epochs: 4
minibatch_size: 512
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.03
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_3_1
