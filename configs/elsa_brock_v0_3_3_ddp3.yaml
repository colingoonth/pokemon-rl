# V0.3.3 (3-GPU variant): same reward + entropy as the 4-GPU yaml,
# scaled to 3 GPUs to slot into gpu-node019's 3 free slots (1 GPU
# held by another user). Schedules immediately vs the 4-GPU
# version's 10-day SLURM wait.
#
# Scaling: 8 envs/rank x 3 ranks = 24 envs (was 32 on 4-GPU).
# minibatch_size proportional: 384 (was 512). Per-rank optimizer-
# step count preserved.
run_name: elsa_brock_v0_3_3_ddp3
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 24
n_steps: 256
n_epochs: 4
minibatch_size: 384
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.02
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_3_3
