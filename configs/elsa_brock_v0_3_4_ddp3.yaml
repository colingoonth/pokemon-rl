# V0.3.4: full strip + curve-based future-seeking rewards.
# Major redesign — removes BEAT_MON, FLAG, NEW_MAP, MOVE, STEP, MART_PC,
# PC_FIRST_VISIT, GYM, NEW_CATCH. Replaces with log/power-law/capped curves
# that reward GAME STATE rather than per-step actions. Forces emergent
# behavior through future value chains (badges, exploration, pokedex).
#
# entropy_coef 0.02 -> 0.01 — modest reduction, faster policy commitment.
# All other PPO hyperparameters inherited from V0.3.3 3-GPU config.
run_name: elsa_brock_v0_3_4_ddp3
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 24
n_steps: 256
n_epochs: 4
minibatch_size: 384
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_3_4
