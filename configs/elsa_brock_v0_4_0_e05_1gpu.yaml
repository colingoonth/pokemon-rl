# V0.4.0 e05 (1-GPU): high-entropy hypothesis test for V0.4. After
# eager (0.005) collapsed on Tail Whip spam, this pushes the other
# direction — entropy_coef = 0.05 keeps the in-battle action
# distribution wider so Tackle stays in the sampling distribution.
# Single-GPU because L40S availability was 1 free slot on node005.
run_name: elsa_brock_v0_4_0_e05_1gpu
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 8
n_steps: 256
n_epochs: 4
minibatch_size: 128
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.05
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_4_0
