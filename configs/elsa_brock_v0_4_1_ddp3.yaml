# V0.4.1: V0.4.0 + DAMAGE_QUAD_COEF=15 symmetric to HEAL_QUAD.
# Fixes the Tail Whip lock-in seen across V0.4 entropy sweep
# (0.005/0.01/0.03 all collapsed onto Tail Whip in wild battles).
# Root cause: V0.4 removed STEP_PENALTY + had no damage signal, so
# in-battle states were neutral and prolonging battles was profitable
# via discounting. Symmetric damage reward closes that loop without
# adding any per-action signal (still curve-shaped, still state-based).
#
# entropy_coef = 0.01 to match the V0.4 baseline (17653) for direct
# comparison. Keep 17653 running as the no-DAMAGE_QUAD control.
run_name: elsa_brock_v0_4_1_ddp3
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 24
n_steps: 256
n_epochs: 4
minibatch_size: 384
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_4_1
