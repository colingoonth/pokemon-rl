# V0.4.2 center arm (DDP3 — expected best outcome):
#   BATTLE_STALL -0.01/step after 30 + DAMAGE_QUAD 15->5 + LOSE -20->-10
# Predicted Blue rival bootstrap breakeven ~57% (down from ~75% in V0.4.1).
# entropy_coef 0.01 (standard, not eager) because this is the variant
# we expect to actually run as a full training arm, not a fast probe.
run_name: elsa_brock_v0_4_2_center_ddp3
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 24
n_steps: 256
n_epochs: 4
minibatch_size: 384
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_4_2_center
