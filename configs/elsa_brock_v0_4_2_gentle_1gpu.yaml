# V0.4.2 gentle arm (1GPU — eager probe):
#   BATTLE_STALL -0.01/step after 30 + DAMAGE_QUAD 15->3 + LOSE -20->-7
# Predicted Blue rival bootstrap breakeven ~51%. Tests whether more
# bootstrap headroom lets the agent commit to combat habits before
# refining away suboptimal moves.
# entropy_coef 0.005 (eager probe — diagnostic-probe discipline).
run_name: elsa_brock_v0_4_2_gentle_1gpu
state_path: states/blue_fight.state
total_timesteps: 200_000_000
n_envs: 8
n_steps: 256
n_epochs: 4
minibatch_size: 128
learning_rate: 2.5e-4
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.1
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5
anneal_lr: true
seed: 0
log_every: 10
async_envs: true
reward_class: RewardV0_4_2_gentle
