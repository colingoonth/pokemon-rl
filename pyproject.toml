[project]
name = "pokerl"
version = "0.0.1"
description = "PPO agent that learns to play Pokemon Red"
requires-python = ">=3.11"
dependencies = [
    "pyboy>=2.0",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "torch>=2.1",
    "imageio[ffmpeg]>=2.34",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokerl"]
